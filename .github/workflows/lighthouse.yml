name: Lighthouse CI

on:
  workflow_dispatch:
  schedule:
    # Weekly audit (Monday 06:00 UTC).
    - cron: "0 6 * * 1"

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Audits a running deployment. Set the repository variable
      # LIGHTHOUSE_URL to the deployed frontend origin (e.g. https://realtyhub.example).
      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ vars.LIGHTHOUSE_URL || 'http://localhost:3000' }}
          configPath: ./frontend/lighthouserc.json
          uploadArtifacts: true
